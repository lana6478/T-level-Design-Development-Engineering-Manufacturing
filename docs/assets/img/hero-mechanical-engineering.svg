<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" width="480" height="280" role="img" aria-label="Illustration of an engineering drawing with dimension lines beside a mechanical gear and a caliper, representing designing and developing mechanical solutions">
  <rect width="480" height="280" rx="10" fill="#eaf3ff"/>

  <!-- technical drawing sheet -->
  <g transform="translate(70,50)">
    <rect x="0" y="0" width="190" height="150" rx="4" fill="#ffffff" stroke="#a9c8f0" stroke-width="2"/>
    <rect x="10" y="10" width="170" height="130" fill="none" stroke="#cfe1f7" stroke-width="1"/>
    <!-- component outline -->
    <rect x="35" y="35" width="70" height="70" fill="none" stroke="#0645ad" stroke-width="3"/>
    <circle cx="70" cy="70" r="18" fill="none" stroke="#0645ad" stroke-width="3"/>
    <!-- dimension lines -->
    <g stroke="#54595d" stroke-width="1.2">
      <line x1="35" y1="115" x2="105" y2="115"/>
      <line x1="35" y1="111" x2="35" y2="119"/>
      <line x1="105" y1="111" x2="105" y2="119"/>
    </g>
    <text x="70" y="126" text-anchor="middle" font-size="9" fill="#54595d" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">70 mm</text>
    <g stroke="#54595d" stroke-width="1.2">
      <line x1="120" y1="35" x2="120" y2="105"/>
      <line x1="116" y1="35" x2="124" y2="35"/>
      <line x1="116" y1="105" x2="124" y2="105"/>
    </g>
    <text x="150" y="73" text-anchor="middle" font-size="9" fill="#54595d" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">70</text>
  </g>

  <!-- gear -->
  <g transform="translate(340,90)" fill="#0645ad">
    <g>
      <rect x="-6" y="-38" width="12" height="16" rx="2"/>
      <rect x="-6" y="22" width="12" height="16" rx="2"/>
      <rect x="-38" y="-6" width="16" height="12" rx="2"/>
      <rect x="22" y="-6" width="16" height="12" rx="2"/>
    </g>
    <g transform="rotate(45)">
      <rect x="-6" y="-38" width="12" height="16" rx="2"/>
      <rect x="-6" y="22" width="12" height="16" rx="2"/>
      <rect x="-38" y="-6" width="16" height="12" rx="2"/>
      <rect x="22" y="-6" width="16" height="12" rx="2"/>
    </g>
    <circle r="28" fill="#0645ad"/>
    <circle r="11" fill="#eaf3ff"/>
  </g>

  <!-- caliper -->
  <g transform="translate(300,180)" stroke="#0645ad" stroke-width="4" fill="none" stroke-linecap="round">
    <line x1="0" y1="0" x2="10" y2="40"/>
    <line x1="70" y1="0" x2="60" y2="40"/>
    <line x1="0" y1="0" x2="70" y2="0"/>
    <line x1="10" y1="40" x2="60" y2="40"/>
  </g>

  <text x="240" y="252" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#54595d">Designing, developing and testing mechanical solutions</text>
</svg>
